<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="65%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0d1527"/>
      <stop offset="60%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#020307"/>
    </radialGradient>

    <!-- Neon Cyan Metallic Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#0044ff"/>
    </linearGradient>

    <!-- Hot Magenta Gradient -->
    <linearGradient id="magenta-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff00a0"/>
      <stop offset="100%" stop-color="#7a00ff"/>
    </linearGradient>

    <!-- Armor Plate Metallic Gradient -->
    <linearGradient id="armor-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <linearGradient id="armor-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="glow-heavy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="25" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Icon Shape (Rounded Squircle for Favicon App Icon Style) -->
  <rect width="512" height="512" rx="110" fill="url(#bg-glow)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#cyan-glow)" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Background Cyber Grid / Circuit Lines (Subtle Context) -->
  <g stroke="#00f3ff" stroke-opacity="0.1" stroke-width="2" fill="none">
    <path d="M 65,256 L 150,256 L 190,296"/>
    <path d="M 447,256 L 362,256 L 322,296"/>
    <path d="M 256,65 L 256,120"/>
    <circle cx="65" cy="256" r="4" fill="#00f3ff" fill-opacity="0.2"/>
    <circle cx="447" cy="256" r="4" fill="#00f3ff" fill-opacity="0.2"/>
  </g>

  <!-- ================= LEOPARD HEAD STRUCTURE ================= -->
  <g transform="translate(0, 20)">

    <!-- Outer Tech Aura / Glow Backing -->
    <polygon points="256,70 340,120 400,210 370,300 256,430 142,300 112,210 172,120" 
             fill="none" stroke="url(#cyan-glow)" stroke-width="1" opacity="0.15" filter="url(#glow-heavy)"/>

    <!-- Ears -->
    <!-- Left Ear -->
    <g>
      <polygon points="125,185 155,100 210,135" fill="url(#armor-dark)" stroke="url(#cyan-glow)" stroke-width="3"/>
      <polygon points="140,175 160,115 195,140" fill="url(#armor-light)"/>
      <polygon points="150,165 165,125 185,145" fill="url(#magenta-glow)" opacity="0.8" filter="url(#glow-subtle)"/>
    </g>
    <!-- Right Ear -->
    <g>
      <polygon points="387,185 357,100 302,135" fill="url(#armor-dark)" stroke="url(#cyan-glow)" stroke-width="3"/>
      <polygon points="372,175 352,115 317,140" fill="url(#armor-light)"/>
      <polygon points="362,165 347,125 327,145" fill="url(#magenta-glow)" opacity="0.8" filter="url(#glow-subtle)"/>
    </g>

    <!-- Outer Silhouette / Crown & Temples -->
    <!-- Forehead Central Shield -->
    <polygon points="256,110 300,150 256,190 212,150" fill="url(#armor-light)" stroke="url(#cyan-glow)" stroke-width="2"/>
    
    <!-- Crown Side Plates -->
    <polygon points="212,150 256,110 200,95 165,135" fill="url(#armor-dark)" stroke="#1e293b" stroke-width="2"/>
    <polygon points="300,150 256,110 312,95 347,135" fill="url(#armor-dark)" stroke="#1e293b" stroke-width="2"/>

    <!-- Cheek Plates (Jaw Outline) -->
    <polygon points="145,210 185,225 160,295 120,240" fill="url(#armor-dark)" stroke="url(#cyan-glow)" stroke-width="2"/>
    <polygon points="367,210 327,225 352,295 392,240" fill="url(#armor-dark)" stroke="url(#cyan-glow)" stroke-width="2"/>

    <!-- Mid-Face Structure -->
    <polygon points="212,150 256,190 205,240 185,225" fill="url(#armor-light)"/>
    <polygon points="300,150 256,190 307,240 327,225" fill="url(#armor-light)"/>

    <!-- Lower Jaw / Muzzle Base -->
    <polygon points="205,240 256,270 256,365 210,340 160,295" fill="url(#armor-dark)" stroke="url(#cyan-glow)" stroke-width="2"/>
    <polygon points="307,240 256,270 256,365 302,340 352,295" fill="url(#armor-dark)" stroke="url(#cyan-glow)" stroke-width="2"/>

    <!-- Chin Cyber Plate -->
    <polygon points="256,380 220,345 256,325 292,345" fill="url(#armor-light)" stroke="url(#magenta-glow)" stroke-width="2"/>

    <!-- ================= LEOPARD SPOTS (CYBER ROSSETTES) ================= -->
    <!-- Forehead Spots -->
    <polygon points="256,125 264,135 256,145 248,135" fill="url(#cyan-glow)"/>
    <polygon points="225,130 233,138 225,146 217,138" fill="url(#magenta-glow)"/>
    <polygon points="287,130 295,138 287,146 279,138" fill="url(#magenta-glow)"/>

    <!-- Cheek Rosettes (Left) -->
    <g fill="none" stroke="url(#cyan-glow)" stroke-width="2.5" filter="url(#glow-subtle)">
      <path d="M 145,235 L 155,230 L 160,240"/>
      <path d="M 140,255 L 152,250 L 155,265 L 142,268"/>
      <path d="M 165,275 L 175,270 L 180,282"/>
      <path d="M 180,235 L 192,238 L 188,250"/>
    </g>

    <!-- Cheek Rosettes (Right) -->
    <g fill="none" stroke="url(#cyan-glow)" stroke-width="2.5" filter="url(#glow-subtle)">
      <path d="M 367,235 L 357,230 L 352,240"/>
      <path d="M 372,255 L 360,250 L 357,265 L 370,268"/>
      <path d="M 347,275 L 337,270 L 332,282"/>
      <path d="M 332,235 L 320,238 L 324,250"/>
    </g>

    <!-- Nose / Bridge Spot Accents -->
    <polygon points="256,210 262,220 256,230 250,220" fill="url(#magenta-glow)"/>

    <!-- ================= EYES (THE GLOWING TECH FOCAL POINT) ================= -->
    <!-- Left Eye -->
    <g filter="url(#glow-heavy)">
      <polygon points="175,210 220,220 185,235" fill="#000"/>
      <polygon points="178,212 217,220 187,232" fill="url(#cyan-glow)"/>
      <polygon points="190,217 210,220 193,227" fill="#fff"/>
      <!-- Eye Trailing Tech Line -->
      <path d="M 175,210 L 135,200" stroke="url(#cyan-glow)" stroke-width="3" fill="none"/>
      <circle cx="135" cy="200" r="3" fill="#00f3ff"/>
    </g>

    <!-- Right Eye -->
    <g filter="url(#glow-heavy)">
      <polygon points="337,210 292,220 327,235" fill="#000"/>
      <polygon points="334,212 295,220 325,232" fill="url(#cyan-glow)"/>
      <polygon points="322,217 302,220 319,227" fill="#fff"/>
      <!-- Eye Trailing Tech Line -->
      <path d="M 337,210 L 377,200" stroke="url(#cyan-glow)" stroke-width="3" fill="none"/>
      <circle cx="377" cy="200" r="3" fill="#00f3ff"/>
    </g>

    <!-- ================= NOSE & MUZZLE ================= -->
    <!-- Cyber Nose -->
    <polygon points="256,260 275,285 256,300 237,285" fill="url(#magenta-glow)" filter="url(#glow-subtle)"/>

    <!-- Tech Whiskers / Data Lines -->
    <g stroke="url(#cyan-glow)" stroke-width="2" fill="none" opacity="0.85" filter="url(#glow-subtle)">
      <!-- Left Whiskers -->
      <path d="M 220,295 L 130,285"/>
      <path d="M 215,305 L 140,310"/>
      <path d="M 220,315 L 160,335"/>
      <!-- Right Whiskers -->
      <path d="M 292,295 L 382,285"/>
      <path d="M 297,305 L 372,310"/>
      <path d="M 292,315 L 352,335"/>
    </g>

    <!-- Whisker Node Dots -->
    <g fill="#00f3ff">
      <circle cx="130" cy="285" r="3"/>
      <circle cx="140" cy="310" r="2.5"/>
      <circle cx="160" cy="335" r="2"/>
      <circle cx="382" cy="285" r="3"/>
      <circle cx="372" cy="310" r="2.5"/>
      <circle cx="352" cy="335" r="2"/>
    </g>

    <!-- Muzzle Center Line -->
    <line x1="256" y1="300" x2="256" y2="325" stroke="url(#magenta-glow)" stroke-width="3"/>

    <!-- Mouth Line -->
    <path d="M 230,330 Q 256,340 282,330" fill="none" stroke="url(#cyan-glow)" stroke-width="2.5"/>

  </g>
</svg>
